<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Individual Project</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <nav>
        <div class="nav__container">
          <div class="nav__logo">
            <img
              class="nav__logo--img"
              src="./assets/blinker-icon.4f9b2663.png"
              alt="LOGO"
            />
          </div>
          <ul class="nav__links">
            <li><a href="#" class="nav__link">Home</a></li>
            <li><a href="#" class="nav__link">Find your Movies</a></li>
            <li><a href="#" class="nav__link nav__link--primary">Contacts</a></li>
          </ul>
        <button class="btn__menu" onclick="openMenu()">☰
          </button>
          <div class="menu__backdrop ul">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
              <i class="fas fa-time"></i>
            </button>
            <ul>
            <li class="menu__list">
              <a href="#" class="menu__link">Home</a>
            </li>
            <li class="menu__list">
              <a href="#Find your Movies" class="menu__lnkt">Find your Movies</a>
            </li>
            <li class="menu__list">
              <a class="menu__link no-cursor">Contacts</a>
            </li>
          </ul>

          </div>
        </div>
        
      </nav>
    <section id="landing">   
      
      <header>
        <main class id="movies__main">
          <section>
            <div class="container">
              <div class="row">
                <div class="movies__header">
                  <h1>Browse for Movies</h1>
                  
                  <form class="search-bar">
                    <input
                      type="text"
                      class="search-bar input"
                      placeholder="Search for Movie."
                      id="search-bar"
                    />
                    <button class="search-bar__button" type="submit">
                      Search
                    </button>
                  </form>

                  <div class="movies__titles">
                    <h2 class="movies__title">All Movies</h2>
                    <select id="filter">
                      <option value="" disabled selected>Sort By:</option>
                      <option value="Title A to Z">Title A to Z</option>
                      <option value="Title Z to A">Title Z to A</option>
                      <option value="Rated">Rated</option>
                      <option value="Year Newest">Year Newest</option>
                      <option value="Year Oldest">Year Oldest</option>
                    </select>
                  </div>
                  <div class="movies movie__loading">
                    <i class="fas fa-spinner movie__loading--spinner"></i> 
                  </div>
                   
                  <div class="movies__container">
                    <div class="row">
                      <div class="movies">
                        <div class="movie">
                          <figure class="movie__poster--warpper">
                            <!--Poster:-->
                            <img class="movie__img"
                              src="https://m.media-amazon.com/images/M/MV5BZGRiMDE1NTMtMThmZS00YjE4LWI1ODQtNjRkZGZlOTg2MGE1XkEyXkFqcGc@._V1_SX300.jpg"
                              alt=""
                            />
                          </figure>
                          <p><b>Title:</b>
                          <b>Type:</b>
                          <b>Year:</b>
                          <b>imdbId:</b></p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </header>
    </section>
    <footer>
    <div class="footer__container">
      <div class="footer__logo">
        <img class="footer__logo--img"
        src="./assets/blinker-icon.4f9b2663.png"
        alt="LOGO">
      </div>
    <div class="footer__links">
            <a href="#" class="footer__link">Home</a>
            <a href="#" class="footer__link">Find your Movies</a>
            <a href="#" class="footer__link footer__link--primary">Contacts</a>
          </div>
       
    </div>

  </footer>

  </body>
  </html>
