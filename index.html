<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Individual Project</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="nav__container">
          <div class="nav__logo">
            <img
              class="nav__logo--img"
              src="./assets/blinker-icon.4f9b2663.png"
              alt="LOGO"
            />
          </div>
          <div class="nav__links">
            <a href="#" class="nav__link">Home</a>
            <a href="#" class="nav__link">Find your Movies</a>
            <a href="#" class="nav__link nav__link--primary">Contacts</a>
          </div>
        </div>

        <button class="btn__menu" onclick="openMenu()"></button>
      </nav>

      <header>
        <main class id="movies__main">
          <section>
            <div class="container">
              <div class="row">
                <div class="movies__header">
                  <div class="header__description">
                    <h1>Browse for Movies</h1>
                    <div class="search-bar">
                      <input
                        type="text"
                        class="search-bar input"
                        placeholder="Search for Movie."
                      />
                      <button class="search-bar__button">Search</button>
                    </div>
                     <div class="movies__titles">
                      <h2 class="movies__title">All Movies</h2>
                      <select id="filter">
                        <option value="" disabled selected>Sort By:</option>
                        <option value="Title A to Z">Title A to Z</option>
                        <option value="Title Z to A">Title Z to A</option>
                        <option value="Rated">Rated</option>
                        <option value="Released Date">Released Data</option>
                        <option value="Genre">Genre</option>
                      </select>
                     </div>
                      <div class="moives_container">
                        <div class="moive">
                        <h3></h3>
                        <figure class="moive__poster--warpper"><b><!--Poster:--></b><a href="https://m.media-amazon.com/images/M/MV5BZGRiMDE1NTMtMThmZS00YjE4LWI1ODQtNjRkZGZlOTg2MGE1XkEyXkFqcGc@._V1_SX300.jpg"></a></figure>
                        <p><b>Title:</b> Title</p>
                        <p><b>Type:</b> 00000000000000</p>
                        <p><b>Year:</b> 0000</p>
                        <p><b>imdbID:</b> 000000000</p>
                      </div>
                      </div>
                    
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </header>
    </section>
  </body>
</html>
